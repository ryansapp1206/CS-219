<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Sandbox</title>
        <link rel="stylesheet" href="../css/css.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <p id="demo"></p>

        <script>
            function add(a, b){
                return a + b;
            }

            let sum1 = add(5,5);
            let sum2 = add(5,50);

            document.getElementById("demo").innerHTML = "Sum1 and Sum2 respectively: " + sum1 + ", " + sum2;
        </script>
</html>
